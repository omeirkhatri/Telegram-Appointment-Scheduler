# Development overrides for docker-compose.yml
# This file is automatically loaded by docker-compose in development

services:
  app:
    # Enable hot reload for development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev
    stdin_open: true
    tty: true

  # Override Supabase services for development
  supabase-db:
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    # Enable more verbose logging in development
    command: postgres -c log_statement=all -c log_destination=stderr

  # Development-specific environment variables
  supabase-auth:
    environment:
      - GOTRUE_MAILER_AUTOCONFIRM=true
      - GOTRUE_SMTP_ADMIN_EMAIL=admin@medicare.local
      - GOTRUE_SITE_URL=http://localhost:3000
      - GOTRUE_URI_ALLOW_LIST=*

  # Enable debug mode for storage
  supabase-storage:
    environment:
      - DEBUG=1
      - LOG_LEVEL=debug

  # Enable debug mode for REST API
  supabase-rest:
    environment:
      - PGRST_LOG_LEVEL=debug

  # Development Redis configuration
  redis:
    command: redis-server --appendonly yes --loglevel debug
