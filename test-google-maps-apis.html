<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .warning { background-color: #fff3cd; border-color: #ffeaa7; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        #map { height: 400px; width: 100%; margin: 20px 0; }
        .log { background: #f8f9fa; padding: 10px; border-radius: 3px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>🗺️ Google Maps API Test</h1>

    <div class="test-section info">
        <h3>📋 Test Configuration</h3>
        <p><strong>API Key:</strong> <span id="api-key-display">Loading...</span></p>
        <p><strong>Environment:</strong> <span id="environment">Loading...</span></p>
        <p><strong>Current Time:</strong> <span id="current-time"></span></p>
    </div>

    <div class="test-section" id="api-key-test">
        <h3>🔑 API Key Test</h3>
        <p id="api-key-result">Testing...</p>
    </div>

    <div class="test-section" id="maps-api-test">
        <h3>🗺️ Maps JavaScript API Test</h3>
        <p id="maps-api-result">Testing...</p>
    </div>

    <div class="test-section" id="geocoding-api-test">
        <h3>📍 Geocoding API Test</h3>
        <p id="geocoding-api-result">Testing...</p>
    </div>

    <div class="test-section" id="places-api-test">
        <h3>🏢 Places API Test</h3>
        <p id="places-api-result">Testing...</p>
    </div>

    <div class="test-section" id="map-rendering-test">
        <h3>🎨 Map Rendering Test</h3>
        <p id="map-rendering-result">Testing...</p>
        <div id="map"></div>
    </div>

    <div class="test-section">
        <h3>📝 Test Log</h3>
        <div class="log" id="test-log"></div>
    </div>

    <script>
        // Get API key from environment
        const API_KEY = 'AIzaSyC-4ehkP28sEBAAYWBFC5jUkbu-EvyQ3qA';

        function log(message) {
            const logElement = document.getElementById('test-log');
            const timestamp = new Date().toLocaleTimeString();
            logElement.textContent += `[${timestamp}] ${message}\n`;
            console.log(message);
        }

        function updateTestResult(testId, success, message) {
            const element = document.getElementById(testId);
            element.textContent = message;
            element.parentElement.className = `test-section ${success ? 'success' : 'error'}`;
        }

        function updateTestWarning(testId, message) {
            const element = document.getElementById(testId);
            element.textContent = message;
            element.parentElement.className = 'test-section warning';
        }

        // Initialize display
        document.getElementById('api-key-display').textContent = API_KEY.substring(0, 10) + '...' + API_KEY.substring(API_KEY.length - 4);
        document.getElementById('environment').textContent = window.location.hostname === 'localhost' ? 'Development' : 'Production';
        document.getElementById('current-time').textContent = new Date().toLocaleString();

        // Test 1: API Key Validation
        function testApiKey() {
            log('Testing API key validation...');

            if (!API_KEY) {
                updateTestResult('api-key-result', false, '❌ No API key provided');
                return false;
            }

            if (API_KEY.length < 35 || API_KEY.length > 45) {
                updateTestResult('api-key-result', false, `❌ Invalid API key length: ${API_KEY.length} characters`);
                return false;
            }

            if (API_KEY.includes('your-') || API_KEY.includes('placeholder')) {
                updateTestResult('api-key-result', false, '❌ API key appears to be a placeholder');
                return false;
            }

            updateTestResult('api-key-result', true, '✅ API key format looks valid');
            return true;
        }

        // Test 2: Maps JavaScript API
        function testMapsAPI() {
            log('Testing Maps JavaScript API...');

            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&libraries=places,geometry&callback=initMap`;
            script.async = true;
            script.defer = true;

            script.onerror = function() {
                updateTestResult('maps-api-result', false, '❌ Failed to load Maps JavaScript API');
                log('Error loading Maps JavaScript API');
            };

            window.initMap = function() {
                updateTestResult('maps-api-result', true, '✅ Maps JavaScript API loaded successfully');
                log('Maps JavaScript API loaded successfully');
                testGeocodingAPI();
                testPlacesAPI();
                testMapRendering();
            };

            document.head.appendChild(script);
        }

        // Test 3: Geocoding API
        function testGeocodingAPI() {
            log('Testing Geocoding API...');

            if (typeof google === 'undefined' || !google.maps) {
                updateTestWarning('geocoding-api-result', '⚠️ Google Maps not loaded yet');
                return;
            }

            const geocoder = new google.maps.Geocoder();
            geocoder.geocode({ address: 'Dubai, UAE' }, function(results, status) {
                if (status === 'OK' && results && results.length > 0) {
                    updateTestResult('geocoding-api-result', true, '✅ Geocoding API working');
                    log('Geocoding API test successful');
                } else {
                    updateTestResult('geocoding-api-result', false, `❌ Geocoding API failed: ${status}`);
                    log(`Geocoding API test failed: ${status}`);
                }
            });
        }

        // Test 4: Places API
        function testPlacesAPI() {
            log('Testing Places API...');

            if (typeof google === 'undefined' || !google.maps || !google.maps.places) {
                updateTestWarning('places-api-result', '⚠️ Places API not available');
                return;
            }

            try {
                const service = new google.maps.places.PlacesService(document.createElement('div'));
                updateTestResult('places-api-result', true, '✅ Places API available');
                log('Places API test successful');
            } catch (error) {
                updateTestResult('places-api-result', false, `❌ Places API error: ${error.message}`);
                log(`Places API test failed: ${error.message}`);
            }
        }

        // Test 5: Map Rendering
        function testMapRendering() {
            log('Testing map rendering...');

            if (typeof google === 'undefined' || !google.maps) {
                updateTestWarning('map-rendering-result', '⚠️ Google Maps not loaded yet');
                return;
            }

            try {
                const mapElement = document.getElementById('map');
                const map = new google.maps.Map(mapElement, {
                    center: { lat: 25.2048, lng: 55.2708 }, // Dubai coordinates
                    zoom: 10
                });

                // Add a marker
                new google.maps.Marker({
                    position: { lat: 25.2048, lng: 55.2708 },
                    map: map,
                    title: 'Dubai, UAE'
                });

                updateTestResult('map-rendering-result', true, '✅ Map rendered successfully');
                log('Map rendering test successful');
            } catch (error) {
                updateTestResult('map-rendering-result', false, `❌ Map rendering failed: ${error.message}`);
                log(`Map rendering test failed: ${error.message}`);
            }
        }

        // Run tests
        log('Starting Google Maps API tests...');

        if (testApiKey()) {
            testMapsAPI();
        } else {
            log('API key test failed, skipping other tests');
        }
    </script>
</body>
</html>
