<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Map Loading Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .warning { background-color: #fff3cd; border-color: #ffeaa7; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        #map { height: 400px; width: 100%; margin: 20px 0; border: 1px solid #ccc; }
        .log { background: #f8f9fa; padding: 10px; border-radius: 3px; font-family: monospace; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
        .loading { display: flex; align-items: center; justify-content: center; height: 400px; background: #f8f9fa; border: 1px solid #ccc; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>🗺️ Simple Map Loading Test</h1>

    <div class="test-section info">
        <h3>📋 Test Configuration</h3>
        <p><strong>API Key:</strong> <span id="api-key-display">Loading...</span></p>
        <p><strong>Environment:</strong> <span id="environment">Loading...</span></p>
        <p><strong>Current Time:</strong> <span id="current-time"></span></p>
    </div>

    <div class="test-section" id="loading-test">
        <h3>🔄 Loading Test</h3>
        <p id="loading-result">Testing...</p>
        <div id="map-container">
            <div class="loading" id="loading-overlay">
                <div class="spinner"></div>
                <span>Loading map...</span>
            </div>
            <div id="map" style="display: none;"></div>
        </div>
    </div>

    <div class="test-section">
        <h3>📝 Test Log</h3>
        <div class="log" id="test-log"></div>
    </div>

    <script>
        // Get API key from environment (this would normally come from process.env in Next.js)
        const API_KEY = 'AIzaSyC-4ehkP28sEBAAYWBFC5jUkbu-EvyQ3qA';

        function log(message) {
            const logElement = document.getElementById('test-log');
            const timestamp = new Date().toLocaleTimeString();
            logElement.textContent += `[${timestamp}] ${message}\n`;
            console.log(message);
            // Auto-scroll to bottom
            logElement.scrollTop = logElement.scrollHeight;
        }

        function updateTestResult(testId, success, message) {
            const element = document.getElementById(testId);
            element.textContent = message;
            element.parentElement.className = `test-section ${success ? 'success' : 'error'}`;
        }

        // Initialize display
        document.getElementById('api-key-display').textContent = API_KEY.substring(0, 10) + '...' + API_KEY.substring(API_KEY.length - 4);
        document.getElementById('environment').textContent = window.location.hostname === 'localhost' ? 'Development' : 'Production';
        document.getElementById('current-time').textContent = new Date().toLocaleString();

        // Test map loading with simplified approach
        function testMapLoading() {
            log('Starting simple map loading test...');
            updateTestResult('loading-result', null, 'Loading Google Maps API...');

            // Create script element
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&libraries=places,geometry&callback=initMap`;
            script.async = true;
            script.defer = true;

            // Set up error handling
            script.onerror = function() {
                log('❌ Failed to load Google Maps API script');
                updateTestResult('loading-result', false, '❌ Failed to load Google Maps API');
            };

            // Set up success callback
            window.initMap = function() {
                log('✅ Google Maps API loaded successfully');
                updateTestResult('loading-result', true, '✅ Google Maps API loaded successfully');

                // Hide loading overlay and show map
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('map').style.display = 'block';

                // Create the map
                try {
                    const map = new google.maps.Map(document.getElementById('map'), {
                        center: { lat: 25.2048, lng: 55.2708 }, // Dubai coordinates
                        zoom: 10
                    });

                    // Add a marker
                    new google.maps.Marker({
                        position: { lat: 25.2048, lng: 55.2708 },
                        map: map,
                        title: 'Dubai, UAE'
                    });

                    log('✅ Map rendered successfully');
                } catch (error) {
                    log('❌ Error creating map: ' + error.message);
                    updateTestResult('loading-result', false, '❌ Error creating map: ' + error.message);
                }
            };

            // Add script to document
            document.head.appendChild(script);
            log('📡 Google Maps API script added to document');
        }

        // Start the test
        log('🚀 Starting map loading test...');
        testMapLoading();
    </script>
</body>
</html>
